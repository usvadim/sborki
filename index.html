<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Сборки</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #1c1e21;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    }

    /* 1. ВЕРХНЯЯ ЧАСТЬ: Вывод информации */
    .result-box {
      flex: 1;
      background: #f5f7fa;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #e4e6eb;
      overflow-y: auto;
      margin-bottom: 14px;
      user-select: text;
    }
    .code-badge {
      display: inline-block;
      background: #0066ff;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .result-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .result-text {
      font-size: 16px;
      line-height: 1.45;
      color: #2c2e33;
      margin: 0;
      white-space: pre-line;
    }
    .result-img {
      width: 100%;
      max-height: 240px;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
      object-fit: contain;
      background: #fff;
    }

    /* НИЖНЯЯ ЗОНА УПРАВЛЕНИЯ */
    .controls-zone {
      flex-shrink: 0;
    }

    /* 2. ВЫБОР РЕЖИМА: Надпись слева + переключатель справа */
    .mode-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f5f7fa;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .mode-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #1c1e21;
    }
    .mode-slider-track {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 110px;
      background: #dfe3ea;
      border-radius: 22px;
      padding: 4px;
      height: 44px;
      cursor: pointer;
    }
    .mode-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: #0066ff;
      border-radius: 18px;
      transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 2px 6px rgba(0, 102, 255, 0.3);
    }
    .mode-slider-track.mode-1 .mode-thumb {
      transform: translateX(100%);
    }
    .mode-label {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #65676b;
      transition: color 0.2s;
    }
    .mode-slider-track:not(.mode-1) .mode-label:first-of-type,
    .mode-slider-track.mode-1 .mode-label:last-of-type {
      color: #fff;
    }

    /* 3. ВВОД ЧИСЛА И ПОЛЗУНОК */
    .number-wrapper {
      background: #f5f7fa;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      padding: 10px 14px 14px 14px;
      margin-bottom: 12px;
    }
    .number-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .step-btn {
      width: 56px;
      height: 48px;
      border: none;
      background: #e4e6eb;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 600;
      color: #1c1e21;
      cursor: pointer;
    }
    .step-btn:active {
      background: #d0d3d9;
    }
    .num-input {
      flex: 1;
      height: 48px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      border: 2px solid #e4e6eb;
      border-radius: 12px;
      background: #fff;
      outline: none;
      user-select: text;
    }
    .num-input:focus {
      border-color: #0066ff;
    }
    input[type="range"] {
      width: 100%;
      height: 12px;
      accent-color: #0066ff;
      cursor: pointer;
    }

    /* 4. БОЛЬШИЕ КНОПКИ (8 вариантов) В САМОМ НИЗУ */
    .variants-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .var-btn {
      height: 62px;
      border: 2px solid #e4e6eb;
      background: #fff;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      color: #1c1e21;
      cursor: pointer;
      transition: 0.1s;
    }
    .var-btn:active {
      transform: scale(0.95);
    }
    .var-btn.active {
      border-color: #0066ff;
      background: #0066ff;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 102, 255, 0.25);
    }
        /* ЭКРАН ПИН-КОДА */
    .pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .pin-overlay.hidden {
      display: none;
    }
    .pin-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1c1e21;
    }
    .pin-input {
      width: 180px;
      height: 54px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 6px;
      border: 2px solid #e4e6eb;
      border-radius: 14px;
      outline: none;
      margin-bottom: 14px;
    }
    .pin-input:focus {
      border-color: #0066ff;
    }
    .pin-btn {
      width: 180px;
      height: 48px;
      background: #0066ff;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .pin-error {
      color: #e53935;
      font-size: 14px;
      margin-top: 10px;
      min-height: 20px;
    }

  </style>
</head>
<body>
<div class="pin-overlay" id="pinScreen">
  <div class="pin-title">Введите код доступа</div>
  <input type="password" inputmode="numeric" id="pinInput" class="pin-input" maxlength="8" placeholder="••••">
  <button class="pin-btn" onclick="checkPin()">Войти</button>
  <div class="pin-error" id="pinError"></div>
</div>


<div class="app">
  <!-- 1. ВЕРХ: Вывод информации -->
  <div class="result-box">
    <div class="code-badge" id="codeDisplay">Арматура: 0 0 1</div>
    <h3 class="result-title" id="resTitle"></h3>
    <p class="result-text" id="resText"></p>
    <img id="resImg" class="result-img" src="" alt="Изображение">
  </div>

  <!-- НИЗ: Элементы управления под большой палец -->
  <div class="controls-zone">
    
    <!-- 2. Выбор режима: надпись слева + переключатель 0-1 справа -->
    <div class="mode-wrapper">
      <span class="mode-title-text">Выбор режима</span>
      <div class="mode-slider-track" id="modeTrack" onclick="toggleMode()">
        <div class="mode-thumb"></div>
        <div class="mode-label">8</div>
        <div class="mode-label">9</div>
      </div>
    </div>

    <!-- 3. Ввод числа (клавиатура + ползунок) -->
    <div class="number-wrapper">
      <div class="number-top-row">
        <button class="step-btn" onclick="changeNum(-1)">−</button>
        <input type="number" inputmode="numeric" id="numInput" class="num-input" value="1" min="1" max="300" oninput="onInputNum(this.value)">
        <button class="step-btn" onclick="changeNum(1)">+</button>
      </div>
      <input type="range" id="numSlider" min="1" max="300" value="1" oninput="onInputNum(this.value)">
    </div>

    <!-- 4. Большие кнопки 8 вариантов -->
    <div class="variants-grid" id="variants"></div>

  </div>
</div>

<script src="database.js"></script>

<script>
  // ВАШ СЕКРЕТНЫЙ КОД ДОСТУПА (поменяйте цифры в кавычках на свои):
  const ACCESS_PIN = "2100";

  // Проверяем, вводился ли код ранее на этом телефоне
  if (localStorage.getItem("sklad_auth") === ACCESS_PIN) {
    document.getElementById("pinScreen").classList.add("hidden");
  }

  function checkPin() {
    const entered = document.getElementById("pinInput").value.trim();
    if (entered === ACCESS_PIN) {
      localStorage.setItem("sklad_auth", ACCESS_PIN);
      document.getElementById("pinScreen").classList.add("hidden");
    } else {
      document.getElementById("pinError").innerText = "Неверный код";
      document.getElementById("pinInput").value = "";
    }
  }


  let state = { mode: 0, variant: 0, number: 1 };

    // Впишите сюда любые 8 цифр или названий для кнопок:
  const buttonNames = ["Б", "С", "Р", "Д", "КГ", "К", "ТП", "Т"];

  const variantsContainer = document.getElementById('variants');
  buttonNames.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = 'var-btn' + (i === 0 ? ' active' : '');
    btn.innerText = name;
    btn.onclick = () => {
      document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.variant = i; // В базе данных номер кнопки по-прежнему считается от 0 до 7
      updateResult();
    };
    variantsContainer.appendChild(btn);
  });


  function toggleMode() {
    state.mode = state.mode === 0 ? 1 : 0;
    const track = document.getElementById('modeTrack');
    track.classList.toggle('mode-1', state.mode === 1);
    updateResult();
  }

  function onInputNum(val) {
    if (val === "") return;
    let n = parseInt(val);
    if (isNaN(n)) return;
    if (n < 1) n = 1;
    if (n > 300) n = 300;
    state.number = n;
    document.getElementById('numInput').value = n;
    document.getElementById('numSlider').value = n;
    updateResult();
  }

  function changeNum(delta) {
    onInputNum(state.number + delta);
  }

    function updateResult() {
    // 1. Обновляем синюю плашку Арматура сверху
    const modeSym = document.querySelectorAll('#modeTrack .mode-label').item(state.mode).innerText;
    const catSym = document.querySelector('.var-btn.active').innerText;
    document.getElementById('codeDisplay').innerText = "Арматура: " + modeSym + catSym + " " + state.number;

    // 2. Собираем ключ поиска: "вашСимвол_номерАрматуры" (например: "с_100")
    const productKey = catSym + state.number;

    const titleEl = document.getElementById('resTitle');
    const textEl = document.getElementById('resText');

    if (!productsDB.hasOwnProperty(productKey)) {
      titleEl.innerText = "Арматура не найден";
      textEl.innerText = "Для арматуры «" + catSym + " " + state.number + "» нет записи в базе.";
      return;
    }

    // 3. Берем номер сборки для выбранного блока
    const shelves = productsDB[productKey];
    const shelf = state.mode === 0 ? shelves.slice(0, 1).join("") : shelves.slice(1, 2).join("");
    const warehouseDB = state.mode === 0 ? warehouse1DB : warehouse2DB;

    if (!shelf || shelf === "-" || shelf === "0") {
      titleEl.innerText = "Нет на этом блоке";
      textEl.innerText = "Арматура «" + catSym + " " + state.number + "» отсутствует на выбранном блоке.";
      return;
    }

        titleEl.innerText = "Сборка: " + shelf;
    const cleanShelf = shelf.split("-").shift().split(",").shift().trim();

    // 4. По номеру шкафа достаем 5 параметров места со Страницы 3 или 4
        if (warehouseDB.hasOwnProperty(cleanShelf)) {
      const loc = warehouseDB[cleanShelf];
      const labels = ["Помещение", "Отметка", "Ряд", "Сторона", "Ось"];
      textEl.innerText = labels.map(function(name, i) {
        return name + ": " + loc.at(i);
      }).join("\n");
    } else {
      textEl.innerText = "Для сборки «" + cleanShelf + "» не указано расположение на блоке.";
    }

  }


  updateResult();
</script>

</body>
</html>
