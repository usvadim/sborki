<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">

  <title>Сборки</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, 
         body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      position: fixed;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      display: flex;
      justify-content: center;
      background: #f0f2f5;
    }
    button, input, .mode-slider-track {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
        .app {
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      box-sizing: border-box;
    }
    @media all and (display-mode: standalone) {
      .app {
        padding-bottom: calc(30px + env(safe-area-inset-bottom));
      }
    }
      .result-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #e4e6eb;
      overflow-y: auto;
      margin-bottom: 14px;
      user-select: text;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .code-badge {
      background: #0066ff;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      margin: 0;
    }
    .result-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .result-text {
      font-size: 16px;
      line-height: 1.45;
      color: #2c2e33;
      margin: 0;
      white-space: pre-line;
    }
    .map-wrap {
      position: relative;
      display: inline-block;
      align-self: center;
      margin-top: auto;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .result-img {
      display: block;
      max-width: 100%;
      max-height: 220px;
      width: auto;
      height: auto;
    }
    .map-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #e53935;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7);
      animation: dotPulse 1.5s infinite;
      pointer-events: none;
      display: none;
    }

    @keyframes dotPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.75);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(229, 57, 53, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(229, 57, 53, 0);
      }
    }
    .controls-zone {
      flex-shrink: 0;
    }
    .mode-wrapper {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
    }
    .cat-count-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #333;
      background: #f5f7fa;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      padding: 6px 12px;
      white-space: nowrap;
    }
    .mode-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      background: #f5f7fa;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      padding: 6px 8px 6px 14px;
      flex-shrink: 0;
    }
    .mode-title-text {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
    }
    .mode-slider-track {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 110px;
      background: #dfe3ea;
      border-radius: 22px;
      padding: 4px;
      height: 44px;
      cursor: pointer;
    }
    .mode-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: #0066ff;
      border-radius: 18px;
      transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 2px 6px rgba(0, 102, 255, 0.3);
    }
    .mode-slider-track.mode-1 .mode-thumb {
      transform: translateX(100%);
    }
    .mode-label {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #65676b;
      transition: color 0.2s;
    }
    .mode-slider-track:not(.mode-1) .mode-thumb + .mode-label {
      color: #ffffff !important;
    }

    .mode-slider-track:not(.mode-1) .mode-label:first-of-type,
    .mode-slider-track.mode-1 .mode-label:last-of-type {
      color: #fff;
    }
    .number-wrapper {
      background: #f5f7fa;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      padding: 10px 14px 14px 14px;
      margin-bottom: 12px;
    }
    .number-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .step-btn {
      width: 56px;
      height: 48px;
      border: none;
      background: #e4e6eb;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 600;
      color: #1c1e21;
      cursor: pointer;
    }
    .step-btn:active {
      background: #d0d3d9;
    }
    .num-input {
      flex: 1;
      height: 48px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      border: 2px solid #e4e6eb;
      border-radius: 12px;
      background: #fff;
      outline: none;
      user-select: text;
    }
    .num-input:focus {
      border-color: #0066ff;
    }
    input[type="range"] {
      width: 100%;
      height: 12px;
      accent-color: #0066ff;
      cursor: pointer;
    }
    .variants-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .var-btn {
      height: 62px;
      border: 2px solid #e4e6eb;
      background: #fff;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      color: #1c1e21;
      cursor: pointer;
      transition: 0.1s;
    }
    .var-btn:active {
      transform: scale(0.95);
    }
    .var-btn.active {
      border-color: #0066ff;
      background: #0066ff;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 102, 255, 0.25);
    }
    .var-btn.empty-cat {
      opacity: 0.4;
      background: #e9ecef;
      color: #888;
    }
    .pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .pin-overlay.hidden {
      display: none;
    }
    .pin-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1c1e21;
    }
    .pin-input {
      width: 180px;
      height: 54px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 6px;
      border: 2px solid #e4e6eb;
      border-radius: 14px;
      outline: none;
      margin-bottom: 14px;
    }
    .pin-input:focus {
      border-color: #0066ff;
    }
    .pin-btn {
      width: 180px;
      height: 48px;
      background: #0066ff;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .pin-error {
      color: #e53935;
      font-size: 14px;
      margin-top: 10px;
      min-height: 20px;
    }

  </style>
</head>
<body>
<div class="pin-overlay" id="pinScreen">
  <div class="pin-title">Введите код доступа</div>
  <input type="password" inputmode="numeric" id="pinInput" class="pin-input" maxlength="8" placeholder="••••">
  <button class="pin-btn" onclick="checkPin()">Войти</button>
  <div class="pin-error" id="pinError"></div>
</div>


<div class="app">
  <!-- 1. ВЕРХ: Вывод информации -->
    <div class="result-box">
    <div class="top-row">
      <div class="code-badge" id="codeDisplay">Арматура: 0 0 1</div>
      <h3 class="result-title" id="resTitle"></h3>
    </div>
    <p class="result-text" id="resText"></p>
    <div class="map-wrap">
      <img id="resImg" class="result-img" src="map1.jpeg" alt="Карта">
      <div class="map-dot" id="mapDot"></div>
    </div>

  </div>

  <div class="controls-zone">
    
    <div class="mode-wrapper">
      <div class="cat-count-box" id="catCount"></div>
      <div class="mode-right">
        <span class="mode-title-text">Блок</span>
        <div class="mode-slider-track" id="modeTrack" onclick="toggleMode()">
          <div class="mode-thumb"></div>
          <div class="mode-label">8</div>
          <div class="mode-label">9</div>
        </div>
      </div>
    </div>

    <div class="number-wrapper">
      <div class="number-top-row">
        <button class="step-btn" onclick="changeNum(-1)">−</button>
        <input type="number" inputmode="numeric" id="numInput" class="num-input" value="1" min="1" max="300" oninput="onInputNum(this.value)">
        <button class="step-btn" onclick="changeNum(1)">+</button>
      </div>
      <input type="range" id="numSlider" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
    </div>

    <div class="variants-grid" id="variants"></div>

  </div>
</div>

<script src="database.js"></script>

<script>
  const ACCESS_PIN = "2100";
  if (localStorage.getItem("sklad_auth") === ACCESS_PIN) {
    document.getElementById("pinScreen").classList.add("hidden");
  }

  function checkPin() {
    const entered = document.getElementById("pinInput").value.trim();
    if (entered === ACCESS_PIN) {
      localStorage.setItem("sklad_auth", ACCESS_PIN);
      document.getElementById("pinScreen").classList.add("hidden");
    } else {
      document.getElementById("pinError").innerText = "Неверный код";
      document.getElementById("pinInput").value = "";
    }
  }


  let state = { mode: 0, variant: 0, number: 1 };

  const buttonNames = ["Б", "С", "Р", "Д", "КГ", "К", "ТП", "Т"];

  const warehouseMaps = ["map1.jpeg", "map2.jpeg"];

    function findFirstExistingNumber(catName, modeIdx) {
    if (typeof productsDB === "undefined") return 1;
    for (let n = 1; n <= 300; n++) {
      const k1 = catName + " " + n;
      const k2 = catName + n;
      const val = productsDB.hasOwnProperty(k1) ? productsDB[k1] : (productsDB.hasOwnProperty(k2) ? productsDB[k2] : null);
      if (Array.isArray(val)) {
        const s = val.slice(modeIdx, modeIdx + 1).join("").trim();
        if (s && s !== "-" && s !== "0") {
          return n;
        }
      }
    }
    return null;
  }

  function updateCategoryButtonsState() {
    document.querySelectorAll('.var-btn').forEach((btn, idx) => {
      const firstNum = findFirstExistingNumber(buttonNames.slice(idx, idx + 1).join(""), state.mode);
      btn.classList.toggle('empty-cat', firstNum === null);
    });
  }

  const variantsContainer = document.getElementById('variants');
  buttonNames.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = 'var-btn' + (i === 0 ? ' active' : '');
    btn.innerText = name;
    btn.onclick = () => {
      document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.variant = i;

      const firstNum = findFirstExistingNumber(name, state.mode);
      if (firstNum !== null) {
        onInputNum(firstNum);
      } else {
        updateResult();
        document.getElementById('resTitle').innerText = "";
        document.getElementById('resText').innerText = "Данной арматуры нет на этом блоке";
      }
    };
    variantsContainer.appendChild(btn);
  });

  function toggleMode() {
    state.mode = state.mode === 0 ? 1 : 0;
    const track = document.getElementById('modeTrack');
    track.classList.toggle('mode-1', state.mode === 1);
    updateCategoryButtonsState();

    const currentCat = buttonNames.slice(state.variant, state.variant + 1).join("");
    const firstNum = findFirstExistingNumber(currentCat, state.mode);
    if (firstNum !== null) {
      onInputNum(firstNum);
    } else {
      updateResult();
      document.getElementById('resTitle').innerText = "";
      document.getElementById('resText').innerText = "Данной арматуры нет на этом блоке";
    }
  }
  function getExistingNumbersList() {
    const list = [];
    if (typeof productsDB === "undefined") return list;
    const catName = buttonNames.slice(state.variant, state.variant + 1).join("");
    for (let n = 1; n <= 300; n++) {
      const k1 = catName + " " + n;
      const k2 = catName + n;
      const val = productsDB.hasOwnProperty(k1) ? productsDB[k1] : (productsDB.hasOwnProperty(k2) ? productsDB[k2] : null);
      if (Array.isArray(val)) {
        const s = val.slice(state.mode, state.mode + 1).join("").trim();
        if (s && s !== "-" && s !== "0") {
          list.push(n);
        }
      }
    }
    return list;
  }

  function syncSliderRange(existingList, currentNum) {
    const slider = document.getElementById('numSlider');
    if (existingList.length === 0) {
      slider.min = 1;
      slider.max = 1;
      slider.value = 1;
      return;
    }
    slider.min = 0;
    slider.max = existingList.length - 1;
    const idx = existingList.indexOf(currentNum);
    slider.value = idx !== -1 ? idx : 0;
  }

  function onSliderMove(idxVal) {
    const list = getExistingNumbersList();
    if (list.length === 0) return;
    const idx = parseInt(idxVal);
    if (isNaN(idx) || idx < 0 || idx >= list.length) return;
    const realNum = list.slice(idx, idx + 1).shift();
    state.number = realNum;
    document.getElementById('numInput').value = realNum;
    updateResult();
  }

  function onInputNum(val) {
    if (val === "") return;
    let n = parseInt(val);
    if (isNaN(n)) return;
    const list = getExistingNumbersList();
    if (list.length > 0) {
      if (list.indexOf(n) === -1) {
        let closest = list.slice(0, 1).shift();
        for (let i = 0; i < list.length; i++) {
          const item = list.slice(i, i + 1).shift();
          if (Math.abs(item - n) < Math.abs(closest - n)) {
            closest = item;
          }
        }
        n = closest;
      }
    } else {
      if (n < 1) n = 1;
      if (n > 300) n = 300;
    }
    state.number = n;
    document.getElementById('numInput').value = n;
    syncSliderRange(list, n);
    updateResult();
  }

  function changeNum(delta) {
    const list = getExistingNumbersList();
    if (list.length === 0) return;
    const idx = list.indexOf(state.number);
    let nextIdx = idx === -1 ? 0 : idx + delta;
    if (nextIdx < 0) nextIdx = 0;
    if (nextIdx >= list.length) nextIdx = list.length - 1;
    const nextNum = list.slice(nextIdx, nextIdx + 1).shift();
    state.number = nextNum;
    document.getElementById('numInput').value = nextNum;
    syncSliderRange(list, nextNum);
    updateResult();
  }

    function updateResult() {
        document.getElementById('mapDot').style.display = "none";
    const modeSym = document.querySelectorAll('#modeTrack .mode-label').item(state.mode).innerText;
    const catSym = document.querySelector('.var-btn.active').innerText.trim();

    let realCount = 0;
    if (typeof productsDB !== "undefined") {
      for (const key in productsDB) {
        if (key.startsWith(catSym + " ") || (key.startsWith(catSym) && !isNaN(parseInt(key.slice(catSym.length))))) {
          const val = productsDB[key];
          const s = Array.isArray(val) ? val.slice(state.mode, state.mode + 1).join("").trim() : "";
          if (s && s !== "-" && s !== "0") {
            realCount++;
          }
        }
      }
    }
    document.getElementById('catCount').innerText = "Позиций: " + realCount;
syncSliderRange(getExistingNumbersList(), state.number);
    document.getElementById('codeDisplay').innerText = "Арматура: " + modeSym + catSym + " " + state.number;
    document.getElementById('resImg').src = warehouseMaps[state.mode];


    const productKey = catSym + state.number;

    const titleEl = document.getElementById('resTitle');
    const textEl = document.getElementById('resText');

    if (!productsDB.hasOwnProperty(productKey)) {
      titleEl.innerText = "Арматура не найден";
      textEl.innerText = "Для арматуры «" + catSym + " " + state.number + "» нет записи в базе.";
      return;
    }

    const shelves = productsDB[productKey];
    const shelf = state.mode === 0 ? shelves.slice(0, 1).join("") : shelves.slice(1, 2).join("");
    const warehouseDB = state.mode === 0 ? warehouse1DB : warehouse2DB;

    if (!shelf || shelf === "-" || shelf === "0") {
      titleEl.innerText = "Нет на этом блоке";
      textEl.innerText = "Арматура «" + catSym + " " + state.number + "» отсутствует на выбранном блоке.";
      return;
    }

        titleEl.innerText = "Сборка: " + shelf;
    const cleanShelf = shelf.split("-").shift().split(",").shift().trim();

        const dotEl = document.getElementById('mapDot');
    const coordsDB = state.mode === 0 ? (typeof mapCoords1 !== "undefined" ? mapCoords1 : {}) : (typeof mapCoords2 !== "undefined" ? mapCoords2 : {});
    const shelfUpper = cleanShelf.toUpperCase();
    if (coordsDB.hasOwnProperty(shelfUpper)) {
      const pt = coordsDB[shelfUpper];
      dotEl.style.left = pt.slice(0, 1) + "%";
      dotEl.style.top = pt.slice(1, 2) + "%";
      dotEl.style.display = "block";
    } else {
      dotEl.style.display = "none";
    }

    if (warehouseDB.hasOwnProperty(cleanShelf)) {
      const loc = warehouseDB[cleanShelf];
      const labels = ["Помещение", "Отметка", "Ряд", "Сторона", "Ось"];
      textEl.innerText = labels.map(function(name, i) {
        return name + ": " + loc.at(i);
      }).join("\n");
    } else {
      textEl.innerText = "Для сборки «" + cleanShelf + "» не указано расположение на блоке.";
    }
  }
    updateCategoryButtonsState();
  const initFirst = findFirstExistingNumber(buttonNames.slice(0, 1).join(""), state.mode);
  if (initFirst !== null) {
    state.number = initFirst;
    document.getElementById('numInput').value = initFirst;
    document.getElementById('numSlider').value = initFirst;
  }

  updateResult();
      /*
  const collectedCoords = {};
  document.getElementById('resImg').addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
    const dot = document.getElementById('mapDot');
    dot.style.left = x + "%";
    dot.style.top = y + "%";
    dot.style.display = "block";

    const shelfNum = prompt("Введите номер шкафа (или нажмите Отмена, чтобы получить весь список):");
    if (shelfNum === null) {
      let out = "";
      for (const k in collectedCoords) {
        out += '"' + k + '": [' + collectedCoords[k] + '],\n';
      }
      prompt("Скопируйте готовый список в database.js:", out);
      return;
    }
    const clean = shelfNum.trim().toUpperCase();
    if (clean) {
      collectedCoords[clean] = x + ", " + y;
    }
  });
  */

</script>

</body>
</html>
